<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 360px; font: 13px system-ui, sans-serif; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h1.sub { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
  .empty { color: #666; line-height: 1.5; }
  .item { border-top: 1px solid #ddd; padding: 10px 0; }
  .title { font-weight: 600; margin-bottom: 8px; word-break: break-all; }
  button { cursor: pointer; padding: 6px 18px; background: #1a9e6f; color: #fff; border: 0; border-radius: 4px; font-size: 13px; }
  button:disabled { background: #999; cursor: default; }
  button.small { padding: 3px 8px; font-size: 11px; background: #666; margin-left: 4px; }
  .status { margin-top: 6px; font-size: 12px; color: #555; word-break: break-all; }
  .job { border-top: 1px solid #ddd; padding: 8px 0; }
  .job .name { word-break: break-all; }
  .job .state { font-size: 12px; margin-top: 2px; }
  .state.queued { color: #b7791f; }
  .state.downloading { color: #1a6fb0; }
  .state.done { color: #1a9e6f; }
  .state.error { color: #c0392b; }
  .bar { height: 4px; background: #e3e3e3; border-radius: 2px; margin-top: 4px; }
  .bar > div { height: 100%; background: #1a6fb0; border-radius: 2px; }
</style>
<h1>本頁偵測到的影片</h1>
<div id="list"></div>
<h1 class="sub"><span>下載清單</span><span><button class="small" id="open">開啟資料夾</button><button class="small" id="clear">清除已完成</button></span></h1>
<div id="jobs"><div class="empty">載入中…</div></div>
<script src="popup.js"></script>
